<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - Coffee Shop</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --surface: #0f172a;
            --surface-2: #111b34;
            --border: #1f2a44;
            --text: #e5e7eb;
            --muted: #a3adc2;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-shell {
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--accent);
            display: grid;
            place-items: center;
            font-weight: 700;
            margin: 0 auto;
        }

        .login-header h1 {
            font-size: 24px;
            margin-top: 12px;
        }

        .login-header p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .login-container {
            background: var(--surface);
            padding: 28px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-weight: 600;
            font-size: 13px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: #0c142b;
            color: var(--text);
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.12);
            color: #fecaca;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 16px;
            display: none;
            text-align: center;
            font-size: 13px;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-bottom: 16px;
            display: none;
            text-align: center;
            font-size: 13px;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--muted);
            margin-top: 10px;
            font-size: 13px;
        }

        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-header">
            <div class="brand-avatar">CH</div>
            <h1>Đăng nhập Admin</h1>
            <p>Chào mừng quay lại hệ thống quản trị</p>
        </div>
        <div class="login-container">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>

            <div class="loading" id="loading">Đang xử lý...</div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loading = document.getElementById('loading');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Ẩn thông báo cũ
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            loading.classList.add('show');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/account/login/web', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, pass: password })
                });

                const data = await response.json();
                loading.classList.remove('show');

                if (response.ok) {
                    // Kiểm tra role admin
                    if (data.data && data.data.user && data.data.user.role === 'admin') {
                        // Lưu token và user vào localStorage TRƯỚC KHI chuyển trang
                        localStorage.setItem('adminToken', data.data.token);
                        localStorage.setItem('adminUser', JSON.stringify(data.data.user));
                        
                        successMessage.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
                        successMessage.classList.add('show');
                        
                        // Chuyển đến trang admin sau 1 giây (có thể bỏ token trong URL vì đã lưu localStorage)
                        setTimeout(() => {
                            window.location.href = '/admin.html';
                        }, 1000);
                    } else {
                        errorMessage.textContent = 'Bạn không có quyền truy cập. Chỉ admin mới được phép đăng nhập.';
                        errorMessage.classList.add('show');
                    }
                } else {
                    errorMessage.textContent = data.error || 'Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin.';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                loading.classList.remove('show');
                errorMessage.textContent = 'Lỗi kết nối. Vui lòng thử lại.';
                errorMessage.classList.add('show');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
