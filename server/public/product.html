<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Coffee Shop</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --surface: #0f172a;
            --surface-2: #111b34;
            --border: #1f2a44;
            --text: #e5e7eb;
            --muted: #a3adc2;
            --accent: #3b82f6;
            --accent-2: #1d4ed8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #0c1226;
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--accent);
            display: grid;
            place-items: center;
            font-weight: bold;
        }

        .brand-title {
            font-size: 13px;
            color: var(--muted);
        }

        .brand-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--muted);
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.12);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .sidebar-footer {
            margin-top: auto;
        }

        .btn-ghost {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .main-area {
            flex: 1;
            padding: 24px 32px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 20px;
        }

        .page-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .page-title {
            font-size: 22px;
            margin-top: 4px;
        }

        .page-description {
            color: var(--muted);
            margin-top: 6px;
            font-size: 13px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0c142b;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            min-width: 260px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            width: 100%;
            font-size: 13px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .section-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-refresh {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-refresh:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #0c142b;
            color: var(--text);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn-primary {
            padding: 8px 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-secondary {
            padding: 8px 14px;
            background: rgba(59, 130, 246, 0.12);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-danger {
            padding: 6px 10px;
            background: rgba(239, 68, 68, 0.16);
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid transparent;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.16);
            color: #bfdbfe;
            border-color: rgba(59, 130, 246, 0.4);
        }

        .table-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .edit-panel {
            margin-top: 20px;
            padding: 14px;
            border: 1px dashed rgba(59, 130, 246, 0.5);
            border-radius: 12px;
            background: var(--surface-2);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-content {
            width: min(860px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            transform: translateY(8px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .modal.open .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .modal-close {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .modal-close:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-item,
        .btn-ghost,
        .btn-refresh,
        .btn-primary,
        .btn-secondary,
        .btn-danger,
        .btn-action,
        .card {
            transition: background-color 0.2s ease, color 0.2s ease,
                border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
        }

        .btn-primary:hover,
        .btn-secondary:hover,
        .btn-refresh:hover,
        .btn-ghost:hover,
        .btn-action:hover,
        .nav-item:hover {
            transform: translateY(-1px);
        }

        .data-table tr {
            transition: background-color 0.2s ease;
        }

        .form-message {
            margin-top: 10px;
            font-size: 12px;
        }

        .form-message.error {
            color: #fecaca;
        }

        .form-message.success {
            color: #bbf7d0;
        }

        .table-empty {
            color: var(--muted);
            margin-top: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        .data-table th,
        .data-table td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .data-table tr:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        @media (max-width: 1100px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 980px) {
            .app-shell {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
            }

            .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .main-area {
                padding: 16px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .search-box {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-avatar">CH</div>
                <div>
                    <div class="brand-title">Admin</div>
                    <div class="brand-subtitle">Coffee_Shop</div>
                </div>
            </div>
            <nav class="nav">
                <a class="nav-item" href="/admin.html">Trang chủ</a>
                <a class="nav-item active" href="/product.html">Sản phẩm</a>
                <a class="nav-item" href="/product-variant.html">Biến thể</a>
                <a class="nav-item" href="/category.html">Danh mục</a>
                <a class="nav-item" href="/order.html">Đơn hàng</a>
                <a class="nav-item" href="#">Khách hàng</a>
                <a class="nav-item" href="#">Thống kê</a>
                <a class="nav-item" href="#">Banner</a>
            </nav>
            <div class="sidebar-footer">
                <a class="btn-ghost" href="/admin.html">Về trang Admin</a>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div>
                    <div class="page-label">Bảng quản trị</div>
                    <div class="page-title">Quản lý sản phẩm</div>
                    <div class="page-description">Thêm, sửa, xóa và quản lý danh sách sản phẩm.</div>
                </div>
                <div class="search-box">
                    <input type="text" placeholder="Tìm kiếm sản phẩm...">
                </div>
            </header>

            <div class="content-grid">
                <section class="card">
                    <div class="section-actions">
                        <h3>Danh sách sản phẩm</h3>
                        <button class="btn-refresh" id="refreshProducts">Tải lại</button>
                    </div>
                    <div id="productStatus" class="table-empty">Đang tải dữ liệu...</div>
                    <table class="data-table" id="productTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Tên</th>
                                <th>Mô tả</th>
                                <th>Danh mục</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody"></tbody>
                    </table>
                </section>

                <section class="card">
                    <h3>Thêm sản phẩm mới</h3>
                    <form id="productForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productCode">Mã sản phẩm</label>
                                <input type="text" id="productCode" name="productCode" placeholder="VD: CF001" required>
                            </div>
                            <div class="form-group">
                                <label for="productName">Tên sản phẩm</label>
                                <input type="text" id="productName" name="productName" placeholder="VD: Cà phê sữa" required>
                            </div>
                            <div class="form-group">
                                <label for="productCategory">Danh mục</label>
                                <select id="productCategory" name="productCategory" required>
                                    <option value="">Chọn danh mục</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label for="productDescription">Mô tả</label>
                                <textarea id="productDescription" name="productDescription" placeholder="Mô tả sản phẩm"></textarea>
                            </div>
                        </div>
                        <div class="form-row" style="grid-template-columns: auto 1fr; align-items: center;">
                            <button type="submit" class="btn-primary">Thêm sản phẩm</button>
                            <div id="productFormMessage" class="form-message"></div>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <div class="modal" id="editProductModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h4>Chỉnh sửa sản phẩm</h4>
                <button type="button" class="modal-close" id="closeEditProductModal">&times;</button>
            </div>
            <form id="editProductForm" class="edit-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editProductCode">Mã sản phẩm</label>
                        <input type="text" id="editProductCode" name="editProductCode" required>
                    </div>
                    <div class="form-group">
                        <label for="editProductName">Tên sản phẩm</label>
                        <input type="text" id="editProductName" name="editProductName" required>
                    </div>
                    <div class="form-group">
                        <label for="editProductCategory">Danh mục</label>
                        <select id="editProductCategory" name="editProductCategory" required>
                            <option value="">Chọn danh mục</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="editProductDescription">Mô tả</label>
                        <textarea id="editProductDescription" name="editProductDescription"></textarea>
                    </div>
                </div>
                <div class="form-row" style="grid-template-columns: auto auto 1fr; align-items: center;">
                    <button type="submit" class="btn-primary">Lưu thay đổi</button>
                    <button type="button" class="btn-secondary" id="cancelEditProduct">Hủy</button>
                    <div id="editProductMessage" class="form-message"></div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || localStorage.getItem('adminToken');
        let cachedCategories = [];
        let currentEditId = null;
        let productMap = {};
        const editProductModal = document.getElementById('editProductModal');

        function openEditProductModal() {
            if (!editProductModal) return;
            editProductModal.classList.add('open');
            editProductModal.setAttribute('aria-hidden', 'false');
        }

        function closeEditProductModal() {
            if (!editProductModal) return;
            editProductModal.classList.remove('open');
            editProductModal.setAttribute('aria-hidden', 'true');
            const editProductMessage = document.getElementById('editProductMessage');
            editProductMessage.textContent = '';
            editProductMessage.className = 'form-message';
        }

        function fillCategoryOptions(selectElement, categories, selectedId = '') {
            if (!selectElement) return;
            selectElement.innerHTML = categories
                .map(
                    (category) =>
                        `<option value="${category._id}">${category.category_name}</option>`
                )
                .join('');
            selectElement.insertAdjacentHTML(
                'afterbegin',
                '<option value="">Chọn danh mục</option>'
            );
            if (selectedId) {
                selectElement.value = selectedId;
            }
        }

        async function fetchCategories() {
            const productCategorySelect = document.getElementById('productCategory');
            const editCategorySelect = document.getElementById('editProductCategory');
            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch('/api/category', { headers });
                const data = await response.json();
                const categories = (data.data && data.data.categories) || [];
                cachedCategories = categories;
                fillCategoryOptions(productCategorySelect, categories);
                fillCategoryOptions(editCategorySelect, categories, editCategorySelect?.value || '');
                return categories;
            } catch (error) {
                console.error('Fetch categories error:', error);
                if (productCategorySelect) {
                    productCategorySelect.innerHTML = '<option value="">Chọn danh mục</option>';
                }
                if (editCategorySelect) {
                    editCategorySelect.innerHTML = '<option value="">Chọn danh mục</option>';
                }
                return [];
            }
        }

        async function fetchProducts(categories = []) {
            const productStatus = document.getElementById('productStatus');
            const productTable = document.getElementById('productTable');
            const productTableBody = document.getElementById('productTableBody');

            productStatus.textContent = 'Đang tải dữ liệu...';
            productTable.style.display = 'none';
            productTableBody.innerHTML = '';

            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch('/api/product', { headers });
                const data = await response.json();

                if (!response.ok) {
                    productStatus.textContent = data.error || 'Không thể tải sản phẩm.';
                    return;
                }

                const products = (data.data && data.data.products) || [];
                if (products.length === 0) {
                    productStatus.textContent = 'Chưa có sản phẩm nào.';
                    return;
                }

                const categoryMap = categories.reduce((acc, category) => {
                    acc[String(category._id)] = category.category_name;
                    return acc;
                }, {});

                productMap = {};
                productTableBody.innerHTML = products
                    .map((product) => {
                        productMap[String(product._id)] = product;
                        const categoryName =
                            categoryMap[String(product.category_id)] || product.category_id || '-';
                        const description = product.description || '';
                        return `
                            <tr>
                                <td>${product.product_code || ''}</td>
                                <td>${product.product_name || ''}</td>
                                <td>${description}</td>
                                <td>${categoryName}</td>
                                <td>
                                    <div class="table-actions">
                                        <button class="btn-action btn-edit" data-id="${product._id}">Sửa</button>
                                        <button class="btn-action btn-danger" data-id="${product._id}">Xóa</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    })
                    .join('');

                productStatus.textContent = '';
                productTable.style.display = 'table';
            } catch (error) {
                console.error('Fetch products error:', error);
                productStatus.textContent = 'Lỗi tải sản phẩm.';
            }
        }

        async function createProduct(payload) {
            const productFormMessage = document.getElementById('productFormMessage');
            productFormMessage.textContent = '';
            productFormMessage.className = 'form-message';

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch('/api/product', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    productFormMessage.textContent = data.error || 'Không thể tạo sản phẩm.';
                    productFormMessage.classList.add('error');
                    return null;
                }

                productFormMessage.textContent = 'Thêm sản phẩm thành công!';
                productFormMessage.classList.add('success');
                return data.data && data.data.product ? data.data.product : null;
            } catch (error) {
                console.error('Create product error:', error);
                productFormMessage.textContent = 'Lỗi tạo sản phẩm.';
                productFormMessage.classList.add('error');
                return null;
            }
        }

        async function updateProduct(id, payload) {
            const editProductMessage = document.getElementById('editProductMessage');
            editProductMessage.textContent = '';
            editProductMessage.className = 'form-message';

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch(`/api/product/${id}`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    editProductMessage.textContent = data.error || 'Không thể cập nhật sản phẩm.';
                    editProductMessage.classList.add('error');
                    return false;
                }

                editProductMessage.textContent = 'Cập nhật sản phẩm thành công!';
                editProductMessage.classList.add('success');
                return true;
            } catch (error) {
                console.error('Update product error:', error);
                editProductMessage.textContent = 'Lỗi cập nhật sản phẩm.';
                editProductMessage.classList.add('error');
                return false;
            }
        }

        async function deleteProduct(id) {
            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch(`/api/product/${id}`, {
                    method: 'DELETE',
                    headers
                });
                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Không thể xóa sản phẩm.');
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Delete product error:', error);
                alert('Lỗi xóa sản phẩm.');
                return false;
            }
        }

        const refreshProductsBtn = document.getElementById('refreshProducts');
        if (refreshProductsBtn) {
            refreshProductsBtn.addEventListener('click', async () => {
                const categories = await fetchCategories();
                fetchProducts(categories);
            });
        }

        const productForm = document.getElementById('productForm');
        if (productForm) {
            productForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const productCodeInput = document.getElementById('productCode');
                const productNameInput = document.getElementById('productName');
                const productCategorySelect = document.getElementById('productCategory');
                const productDescriptionInput = document.getElementById('productDescription');
                const product_code = productCodeInput.value.trim();
                const product_name = productNameInput.value.trim();
                const category_id = productCategorySelect.value;
                const description = productDescriptionInput.value.trim();

                if (!product_code || !product_name || !category_id) {
                    const productFormMessage = document.getElementById('productFormMessage');
                    productFormMessage.textContent = 'Vui lòng nhập đầy đủ thông tin.';
                    productFormMessage.className = 'form-message error';
                    return;
                }

                const createdProduct = await createProduct({
                    product_code,
                    product_name,
                    category_id,
                    description
                });

                if (createdProduct) {
                    productCodeInput.value = '';
                    productNameInput.value = '';
                    productDescriptionInput.value = '';
                    productCategorySelect.value = '';
                    const categories = await fetchCategories();
                    fetchProducts(categories);
                }
            });
        }

        const editProductForm = document.getElementById('editProductForm');
        if (editProductForm) {
            editProductForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!currentEditId) {
                    return;
                }

                const editProductCode = document.getElementById('editProductCode');
                const editProductName = document.getElementById('editProductName');
                const editProductCategory = document.getElementById('editProductCategory');
                const editProductDescription = document.getElementById('editProductDescription');
                const product_code = editProductCode.value.trim();
                const product_name = editProductName.value.trim();
                const category_id = editProductCategory.value;
                const description = editProductDescription.value.trim();

                if (!product_code || !product_name || !category_id) {
                    const editProductMessage = document.getElementById('editProductMessage');
                    editProductMessage.textContent = 'Vui lòng nhập đầy đủ thông tin.';
                    editProductMessage.className = 'form-message error';
                    return;
                }

                const updated = await updateProduct(currentEditId, {
                    product_code,
                    product_name,
                    category_id,
                    description
                });

                if (updated) {
                    currentEditId = null;
                    closeEditProductModal();
                    const categories = await fetchCategories();
                    fetchProducts(categories);
                }
            });
        }

        const cancelEditProduct = document.getElementById('cancelEditProduct');
        if (cancelEditProduct) {
            cancelEditProduct.addEventListener('click', () => {
                currentEditId = null;
                closeEditProductModal();
            });
        }

        const closeEditProductModalBtn = document.getElementById('closeEditProductModal');
        if (closeEditProductModalBtn) {
            closeEditProductModalBtn.addEventListener('click', () => {
                currentEditId = null;
                closeEditProductModal();
            });
        }

        if (editProductModal) {
            editProductModal.addEventListener('click', (event) => {
                if (event.target === editProductModal) {
                    currentEditId = null;
                    closeEditProductModal();
                }
            });
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && editProductModal?.classList.contains('open')) {
                currentEditId = null;
                closeEditProductModal();
            }
        });

        const productTableBody = document.getElementById('productTableBody');
        if (productTableBody) {
            productTableBody.addEventListener('click', async (event) => {
                const target = event.target;
                if (!(target instanceof HTMLElement)) {
                    return;
                }
                if (target.classList.contains('btn-edit')) {
                    const id = target.getAttribute('data-id');
                    if (!id || !productMap[id]) return;
                    const product = productMap[id];
                    currentEditId = id;
                    const editProductCode = document.getElementById('editProductCode');
                    const editProductName = document.getElementById('editProductName');
                    const editProductCategory = document.getElementById('editProductCategory');
                    const editProductDescription = document.getElementById('editProductDescription');
                    editProductCode.value = product.product_code || '';
                    editProductName.value = product.product_name || '';
                    fillCategoryOptions(editProductCategory, cachedCategories, String(product.category_id || ''));
                    editProductDescription.value = product.description || '';
                    openEditProductModal();
                }
                if (target.classList.contains('btn-danger')) {
                    const id = target.getAttribute('data-id');
                    if (!id) return;
                    if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                        return;
                    }
                    const deleted = await deleteProduct(id);
                    if (deleted) {
                        const categories = await fetchCategories();
                        fetchProducts(categories);
                    }
                }
            });
        }

        (async () => {
            const categories = await fetchCategories();
            fetchProducts(categories);
        })();
    </script>
</body>
</html>
