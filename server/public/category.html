<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Coffee Shop</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --surface: #0f172a;
            --surface-2: #111b34;
            --border: #1f2a44;
            --text: #e5e7eb;
            --muted: #a3adc2;
            --accent: #3b82f6;
            --accent-2: #1d4ed8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #0c1226;
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--accent);
            display: grid;
            place-items: center;
            font-weight: bold;
        }

        .brand-title {
            font-size: 13px;
            color: var(--muted);
        }

        .brand-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--muted);
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.12);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .sidebar-footer {
            margin-top: auto;
        }

        .btn-ghost {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .main-area {
            flex: 1;
            padding: 24px 32px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 20px;
        }

        .page-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .page-title {
            font-size: 22px;
            margin-top: 4px;
        }

        .page-description {
            color: var(--muted);
            margin-top: 6px;
            font-size: 13px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .section-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-refresh {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-refresh:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .form-group input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #0c142b;
            color: var(--text);
        }

        .btn-primary {
            padding: 8px 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-secondary {
            padding: 8px 14px;
            background: rgba(59, 130, 246, 0.12);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-danger {
            padding: 6px 10px;
            background: rgba(239, 68, 68, 0.16);
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid transparent;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.16);
            color: #bfdbfe;
            border-color: rgba(59, 130, 246, 0.4);
        }

        .table-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .edit-panel {
            margin-top: 20px;
            padding: 14px;
            border: 1px dashed rgba(59, 130, 246, 0.5);
            border-radius: 12px;
            background: var(--surface-2);
        }

        .form-message {
            margin-top: 10px;
            font-size: 12px;
        }

        .form-message.error {
            color: #fecaca;
        }

        .form-message.success {
            color: #bbf7d0;
        }

        .table-empty {
            color: var(--muted);
            margin-top: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        .data-table th,
        .data-table td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .data-table tr:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        @media (max-width: 1100px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 980px) {
            .app-shell {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
            }

            .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .main-area {
                padding: 16px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-avatar">CH</div>
                <div>
                    <div class="brand-title">Admin</div>
                    <div class="brand-subtitle">Coffee_Shop</div>
                </div>
            </div>
            <nav class="nav">
                <a class="nav-item" href="/admin.html">Trang chủ</a>
                <a class="nav-item" href="/product.html">Sản phẩm</a>
                <a class="nav-item active" href="/category.html">Danh mục</a>
                <a class="nav-item" href="#">Đơn hàng</a>
                <a class="nav-item" href="#">Khách hàng</a>
                <a class="nav-item" href="#">Thống kê</a>
                <a class="nav-item" href="#">Banner</a>
            </nav>
            <div class="sidebar-footer">
                <a class="btn-ghost" href="/admin.html">Về trang Admin</a>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div>
                    <div class="page-label">Bảng quản trị</div>
                    <div class="page-title">Quản lý danh mục</div>
                    <div class="page-description">Tạo mới, chỉnh sửa và quản lý danh mục sản phẩm.</div>
                </div>
            </header>

            <div class="content-grid">
                <section class="card">
                    <div class="section-actions">
                        <h3>Danh sách danh mục</h3>
                        <button class="btn-refresh" id="refreshCategories">Tải lại</button>
                    </div>
                    <div id="categoryStatus" class="table-empty">Đang tải dữ liệu...</div>
                    <table class="data-table" id="categoryTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>Mã danh mục</th>
                                <th>Tên danh mục</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody"></tbody>
                    </table>
                </section>

                <section class="card">
                    <h3>Thêm danh mục mới</h3>
                    <form id="categoryForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="categoryCode">Mã danh mục</label>
                                <input type="text" id="categoryCode" name="categoryCode" placeholder="VD: CF" required>
                            </div>
                            <div class="form-group">
                                <label for="categoryName">Tên danh mục</label>
                                <input type="text" id="categoryName" name="categoryName" placeholder="VD: Cà phê" required>
                            </div>
                        </div>
                        <div class="form-row" style="grid-template-columns: auto 1fr; align-items: center;">
                            <button type="submit" class="btn-primary">Thêm danh mục</button>
                            <div id="categoryFormMessage" class="form-message"></div>
                        </div>
                    </form>
                    <form id="editCategoryForm" class="edit-panel" style="display: none;">
                        <h4>Chỉnh sửa danh mục</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="editCategoryCode">Mã danh mục</label>
                                <input type="text" id="editCategoryCode" name="editCategoryCode" required>
                            </div>
                            <div class="form-group">
                                <label for="editCategoryName">Tên danh mục</label>
                                <input type="text" id="editCategoryName" name="editCategoryName" required>
                            </div>
                        </div>
                        <div class="form-row" style="grid-template-columns: auto auto 1fr; align-items: center;">
                            <button type="submit" class="btn-primary">Lưu thay đổi</button>
                            <button type="button" class="btn-secondary" id="cancelEditCategory">Hủy</button>
                            <div id="editCategoryMessage" class="form-message"></div>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || localStorage.getItem('adminToken');
        let currentEditId = null;
        let categoryMap = {};

        async function fetchCategories() {
            const categoryStatus = document.getElementById('categoryStatus');
            const categoryTable = document.getElementById('categoryTable');
            const categoryTableBody = document.getElementById('categoryTableBody');

            categoryStatus.textContent = 'Đang tải dữ liệu...';
            categoryTable.style.display = 'none';
            categoryTableBody.innerHTML = '';

            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch('/api/category', { headers });
                const data = await response.json();

                if (!response.ok) {
                    categoryStatus.textContent = data.error || 'Không thể tải danh mục.';
                    return [];
                }

                const categories = (data.data && data.data.categories) || [];
                if (categories.length === 0) {
                    categoryStatus.textContent = 'Chưa có danh mục nào.';
                    return [];
                }

                categoryMap = {};
                categoryTableBody.innerHTML = categories
                    .map((category) => {
                        categoryMap[String(category._id)] = category;
                        return `
                            <tr>
                                <td>${category.category_code || ''}</td>
                                <td>${category.category_name || ''}</td>
                                <td>
                                    <div class="table-actions">
                                        <button class="btn-action btn-edit" data-id="${category._id}">Sửa</button>
                                        <button class="btn-action btn-danger" data-id="${category._id}">Xóa</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    })
                    .join('');

                categoryStatus.textContent = '';
                categoryTable.style.display = 'table';
                return categories;
            } catch (error) {
                console.error('Fetch categories error:', error);
                categoryStatus.textContent = 'Lỗi tải danh mục.';
                return [];
            }
        }

        async function createCategory(payload) {
            const categoryFormMessage = document.getElementById('categoryFormMessage');
            categoryFormMessage.textContent = '';
            categoryFormMessage.className = 'form-message';

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch('/api/category', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    categoryFormMessage.textContent = data.error || 'Không thể tạo danh mục.';
                    categoryFormMessage.classList.add('error');
                    return false;
                }

                categoryFormMessage.textContent = 'Thêm danh mục thành công!';
                categoryFormMessage.classList.add('success');
                return true;
            } catch (error) {
                console.error('Create category error:', error);
                categoryFormMessage.textContent = 'Lỗi tạo danh mục.';
                categoryFormMessage.classList.add('error');
                return false;
            }
        }

        async function updateCategory(id, payload) {
            const editCategoryMessage = document.getElementById('editCategoryMessage');
            editCategoryMessage.textContent = '';
            editCategoryMessage.className = 'form-message';

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch(`/api/category/${id}`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    editCategoryMessage.textContent = data.error || 'Không thể cập nhật danh mục.';
                    editCategoryMessage.classList.add('error');
                    return false;
                }

                editCategoryMessage.textContent = 'Cập nhật danh mục thành công!';
                editCategoryMessage.classList.add('success');
                return true;
            } catch (error) {
                console.error('Update category error:', error);
                editCategoryMessage.textContent = 'Lỗi cập nhật danh mục.';
                editCategoryMessage.classList.add('error');
                return false;
            }
        }

        async function deleteCategory(id) {
            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                const response = await fetch(`/api/category/${id}`, {
                    method: 'DELETE',
                    headers
                });
                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Không thể xóa danh mục.');
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Delete category error:', error);
                alert('Lỗi xóa danh mục.');
                return false;
            }
        }

        const refreshCategoriesBtn = document.getElementById('refreshCategories');
        if (refreshCategoriesBtn) {
            refreshCategoriesBtn.addEventListener('click', fetchCategories);
        }

        const categoryForm = document.getElementById('categoryForm');
        if (categoryForm) {
            categoryForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const categoryCodeInput = document.getElementById('categoryCode');
                const categoryNameInput = document.getElementById('categoryName');
                const category_code = categoryCodeInput.value.trim();
                const category_name = categoryNameInput.value.trim();

                if (!category_code || !category_name) {
                    const categoryFormMessage = document.getElementById('categoryFormMessage');
                    categoryFormMessage.textContent = 'Vui lòng nhập đầy đủ thông tin.';
                    categoryFormMessage.className = 'form-message error';
                    return;
                }

                const created = await createCategory({ category_code, category_name });
                if (created) {
                    categoryCodeInput.value = '';
                    categoryNameInput.value = '';
                    fetchCategories();
                }
            });
        }

        const editCategoryForm = document.getElementById('editCategoryForm');
        if (editCategoryForm) {
            editCategoryForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!currentEditId) {
                    return;
                }

                const editCategoryCode = document.getElementById('editCategoryCode');
                const editCategoryName = document.getElementById('editCategoryName');
                const category_code = editCategoryCode.value.trim();
                const category_name = editCategoryName.value.trim();

                if (!category_code || !category_name) {
                    const editCategoryMessage = document.getElementById('editCategoryMessage');
                    editCategoryMessage.textContent = 'Vui lòng nhập đầy đủ thông tin.';
                    editCategoryMessage.className = 'form-message error';
                    return;
                }

                const updated = await updateCategory(currentEditId, {
                    category_code,
                    category_name
                });

                if (updated) {
                    currentEditId = null;
                    editCategoryForm.style.display = 'none';
                    fetchCategories();
                }
            });
        }

        const cancelEditCategory = document.getElementById('cancelEditCategory');
        if (cancelEditCategory) {
            cancelEditCategory.addEventListener('click', () => {
                currentEditId = null;
                editCategoryForm.style.display = 'none';
                const editCategoryMessage = document.getElementById('editCategoryMessage');
                editCategoryMessage.textContent = '';
                editCategoryMessage.className = 'form-message';
            });
        }

        const categoryTableBody = document.getElementById('categoryTableBody');
        if (categoryTableBody) {
            categoryTableBody.addEventListener('click', async (event) => {
                const target = event.target;
                if (!(target instanceof HTMLElement)) {
                    return;
                }
                if (target.classList.contains('btn-edit')) {
                    const id = target.getAttribute('data-id');
                    if (!id || !categoryMap[id]) return;
                    const category = categoryMap[id];
                    currentEditId = id;
                    const editCategoryCode = document.getElementById('editCategoryCode');
                    const editCategoryName = document.getElementById('editCategoryName');
                    editCategoryCode.value = category.category_code || '';
                    editCategoryName.value = category.category_name || '';
                    editCategoryForm.style.display = 'block';
                    editCategoryForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                if (target.classList.contains('btn-danger')) {
                    const id = target.getAttribute('data-id');
                    if (!id) return;
                    if (!confirm('Bạn có chắc chắn muốn xóa danh mục này?')) {
                        return;
                    }
                    const deleted = await deleteCategory(id);
                    if (deleted) {
                        fetchCategories();
                    }
                }
            });
        }

        fetchCategories();
    </script>
</body>
</html>
